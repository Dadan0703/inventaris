[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_22"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction", "rm -rf node_modules package-lock.json && npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
